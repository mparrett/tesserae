  <!-- lg -w -w-shell template: let-go's default xterm shell, plus the largest
       font that fits the game's 76x24 layout (k=1, as in a terminal), and the
       WebGL renderer (the DOM renderer can't keep up with a
       full-screen truecolor raster). The terminal font is bundled (below). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;height:100dvh;background:#000;color:#e8e6df;overflow:hidden;color-scheme:dark}
    /* Breathing room from the browser chrome. On body, not #app: FitAddon reads
       the parent's height as-is, so padding there would overflow the grid. */
    body{display:flex;flex-direction:column;
         padding:max(clamp(12px,4vh,48px),env(safe-area-inset-top)) max(clamp(12px,3vw,48px),env(safe-area-inset-right))
                 max(clamp(12px,4vh,48px),env(safe-area-inset-bottom)) max(clamp(12px,3vw,48px),env(safe-area-inset-left))}
    #app{flex:1;min-height:0;min-width:0}
    .xterm{height:100%}
    /* scrollback is 0, so there's nothing to scroll; xterm's overflow-y:scroll
       still draws an empty track wherever scrollbars are classic (Windows, macOS with a mouse). */
    .xterm .xterm-viewport{overflow-y:hidden}

  <script>
  // The sound mode M picks: the game emits tesserae-sound when it changes, and
  // its worker has no localStorage, so the page keeps it and hands it back as
  // ?sound= before the game starts (the worker reads the URL at init). The URL
  // follows each change, so a reload plays what was last chosen; the default,
  // all, leaves no trace, and ?reset-progress forgets it with the rest. The
  // pad's sound button stays hidden until the game says it has sound (start).
  (() => {
    const KEY = 'tesserae-sound';
    const setURL = (mode) => {
      const p = new URLSearchParams(location.search);
      if (mode === 'all') p.delete('sound'); else p.set('sound', mode);
      const q = p.toString();
      history.replaceState(null, '', `${location.pathname}${q ? '?' + q : ''}${location.hash}`);
    };
    try {
      const p = new URLSearchParams(location.search);
      if (p.has('reset-progress')) localStorage.removeItem(KEY);
      const saved = localStorage.getItem(KEY);
      if (saved && !p.has('sound')) setURL(saved);
    } catch {}
    addEventListener('tesserae-sound', (e) => {
      const mode = e.detail?.mode;
      if (!mode) return;
      document.querySelector('#pad button[data-key="m"]')?.removeAttribute('hidden');
      if (e.detail.start) return;
      setURL(mode);
      try { if (mode === 'all') localStorage.removeItem(KEY); else localStorage.setItem(KEY, mode); } catch {}
    });
  })();
  </script>

(function() {
  const status = document.getElementById('status');
  const termEl = document.getElementById('app');
  // ?font=<key> picks a bundled face (tools/gen-terminal-font.py names the same
  // families); ?font=system uses the platform mono instead.
  const FACES = { cascadia: 'Tess Mono', iosevka: 'Tess Plain', unscii: 'Tess Block', fairfax: 'Tess Fax' };
  const SYSTEM = '"DejaVu Sans Mono", "Menlo", "Consolas", monospace';
  const fontKey = new URLSearchParams(location.search).get('font') || 'iosevka';
  const sysFont = fontKey === 'system';
  if (!sysFont && !FACES[fontKey]) console.warn('unknown ?font=' + fontKey + '; using iosevka');
  const family = FACES[fontKey] || FACES.iosevka;
  const term = new Terminal({
    fontFamily: sysFont ? SYSTEM : `"${family}", "${family} Fallback", ` + SYSTEM,
    fontSize: 14,
    theme: { background: '#000000', foreground: '#e8e6df' },
    allowProposedApi: true,
    convertEol: true,
    scrollback: 0,
    customGlyphs: true,       // pixel-exact block/quadrant glyphs, any font
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);

  // Largest font that fits the game's k=1 layout (76x24), so the arena and the
  // side panel keep the proportions they have in a terminal, or its stacked
  // layout (at least 50x38: the arena, then as much of the panel as fits;
  // game.lg new-screen) when that gives a bigger font, as on a phone held
  // upright. ?grid=large asks for the
  // doubled raster (124x50, k=2) instead: finer rotation and motion, tiny panel
  // text, four times the pixels per frame.
  const large = new URLSearchParams(location.search).get('grid') === 'large';
  // The raster's pixels are square only if a cell is exactly half as wide as
  // it is tall, in device pixels. Fonts and xterm's whole-pixel rounding rarely
  // give that (Cascadia Mono at 15px is 8x18), so pad or tighten the cell with
  // letterSpacing, after rounding an odd cell height up to even with lineHeight.
  // Reads xterm internals; leaves the font as-is if they move.
  function squareCells() {
    const d = term._core?._renderService?.dimensions?.device;
    if (!d || !d.char.width || !d.char.height) return;
    const h = d.char.height + (d.char.height % 2);
    // xterm floors char.height * lineHeight, so aim half a pixel high of h.
    const lineHeight = h === d.char.height ? 1 : (h + 0.5) / d.char.height;
    if (term.options.lineHeight !== lineHeight) term.options.lineHeight = lineHeight;
    // xterm adds letterSpacing to the device-pixel cell unscaled, so this stays in device pixels.
    const letterSpacing = h / 2 - d.char.width;
    if (term.options.letterSpacing !== letterSpacing) term.options.letterSpacing = letterSpacing;
  }
  function fits(fs, cols, rows) {
    term.options.fontSize = fs;
    squareCells();
    const d = fit.proposeDimensions();
    return !!d && d.cols >= cols && d.rows >= rows;
  }
  // Each size tried costs xterm a full re-render, so measure once, scale (the
  // cell grows about linearly with the font size), and walk from the estimate.
  function largest(cols, rows, min) {
    term.options.fontSize = 32;
    squareCells();
    const d = fit.proposeDimensions();
    if (!d) return null;
    let fs = Math.max(min, Math.min(64, Math.floor(32 * Math.min(d.cols / cols, d.rows / rows))));
    if (fits(fs, cols, rows)) {
      while (fs < 64 && fits(fs + 1, cols, rows)) fs++;
      return fs;
    }
    while (--fs >= min) if (fits(fs, cols, rows)) return fs;
    return null;
  }
  function pickFont() {
    return (large && largest(124, 50, 9))
      || Math.max(largest(76, 24, 7) || 0, largest(50, 38, 7) || 0) || 10;
  }
  function layout() { term.options.fontSize = pickFont(); squareCells(); fit.fit(); }
  let layoutQueued = false;
  function queueLayout() {
    if (layoutQueued) return;
    layoutQueued = true;
    requestAnimationFrame(() => { layoutQueued = false; layout(); });
  }

  // The pad types into the VM as a terminal would. An arrow sends kitty-style
  // press and release (CSI 1;1:1 D, CSI 1;1:3 D), which tesserae/input.lg
  // holds for exactly as long as the finger is down; repeats timed from this
  // thread would lapse whenever a frame keeps it busy. Other keys are plain.
  let sendKey = null;
  // The host's input ring refuses a key when it is full: sendInput returns
  // false. A dropped release would hold the arrow until its next press, so a
  // refused key, and every key after it, pad or keyboard, waits here and is
  // retried in order, on a timer so a release refused as the tab hides still
  // goes out. If nothing gets through for 2 s (a stalled VM), the waiting
  // keys are dropped except releases. Mouse motion skips the queue: a report
  // is tried once and dropped if refused or if keys are waiting, since the
  // next one replaces it; clicks queue like keys. A key longer than a ring
  // slot can never fit and is dropped at once (as of 2026-10-27 let-go's
  // lg-host-core.js holds 8 keys of up to 16 bytes, CAPACITY and MAX_KEY_LEN).
  const SLOT_BYTES = 16;
  const enc = new TextEncoder();
  const backlog = [];   // {s, release}
  let since = 0;
  const drain = () => {
    while (backlog.length && sendKey(backlog[0].s)) { backlog.shift(); since = performance.now(); }
    if (backlog.length && performance.now() - since > 2000) {
      backlog.splice(0, backlog.length, ...backlog.filter((q) => q.release));
      since = performance.now();
    }
    if (backlog.length) setTimeout(drain, 16);
  };
  // SGR mouse report: CSI < button ; x ; y M|m, with 32 in button for motion.
  const isMotion = (s) => { const m = /^\x1b\[<(\d+);/.exec(s); return !!m && (m[1] & 32) !== 0; };
  const send = (s, release = false) => {
    if (!sendKey || enc.encode(s).length > SLOT_BYTES) return;
    if (isMotion(s)) { if (!backlog.length) sendKey(s); return; }
    backlog.push({s, release});
    if (backlog.length === 1) { since = performance.now(); drain(); }
  };
  const padParam = new URLSearchParams(location.search).get('pad');
  const padOn = padParam === 'on' || (padParam !== 'off' && matchMedia('(pointer: coarse)').matches);
  document.body.classList.toggle('pad', padOn);
  const releases = new Set();
  for (const b of document.querySelectorAll('#pad button')) {
    const k = b.dataset.key, hold = 'hold' in b.dataset;
    // Fingers down on this button: a second finger adds no press, and the key
    // releases when the last one lifts. Called without an event, everything.
    const fingers = new Set();
    const up = (e) => {
      if (e?.pointerId !== undefined) fingers.delete(e.pointerId); else fingers.clear();
      if (fingers.size || !b.classList.contains('on')) return;
      b.classList.remove('on');
      if (hold) { send(`\x1b[1;1:3${k}`, true); releases.delete(up); }
    };
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();               // keep focus (and the OS keyboard) where it is
      // A pointer already gone can't be captured, and its up would never
      // reach this button; ignore it rather than hold a key no lift releases.
      try { b.setPointerCapture(e.pointerId); } catch { return; }
      fingers.add(e.pointerId);
      if (fingers.size > 1) return;
      b.classList.add('on');
      if (hold) { send(`\x1b[1;1:1${k}`); releases.add(up); }
      else send(k === 'ESC' ? '\x1b' : k);
    });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, up);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  // A release that never arrives would hold the key until the next press.
  const releaseAll = () => { for (const up of [...releases]) up(); };
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', releaseAll);

  window.LetGoHost.onReady(async (mode) => {
    // Hold output until the terminal is open, so nothing written during the
    // font wait below is lost.
    let opened = false, pending = '';
    window.LetGoHost.onOutput((s) => { if (opened) term.write(s); else pending += s; });
    // The host starts the VM without awaiting this callback, so give it a size now;
    // the real size follows once the terminal is open. 76x24 even for ?grid=large,
    // which may not fit: frames drawn too small for the terminal don't wrap.
    if (mode === 'worker') window.LetGoHost.setSize(76, 24);
    // xterm measures the cell in open(), and the WebGL renderer caches each
    // glyph the first time it draws it, so both faces must be loaded first:
    // a face that's declared but unused isn't fetched until something needs it.
    if (!sysFont) {
      const faces = [...document.fonts].filter((f) => [family, family + ' Fallback'].includes(f.family.replace(/"/g, '')));
      try { await Promise.all(faces.map((f) => f.load())); }
      catch (e) { console.warn('terminal font failed to load', e); }
    }
    if (status) status.style.display = 'none';
    term.open(termEl);
    try { term.loadAddon(new WebglAddon.WebglAddon()); window._tessRenderer = 'webgl'; }
    catch (e) { window._tessRenderer = 'dom'; console.warn('webgl renderer unavailable', e); }
    layout();
    term.focus();
    window.addEventListener('resize', queueLayout);
    // Mobile browsers can report a rotation or a toolbar showing before the
    // window's size settles; the visual viewport follows it.
    window.visualViewport?.addEventListener('resize', queueLayout);
    window.addEventListener('orientationchange', queueLayout);
    window._tessTerm = term;
    opened = true;
    if (pending) { term.write(pending); pending = ''; }
    if (mode === 'worker') {
      window.LetGoHost.setSize(term.cols, term.rows);
      term.onResize(({cols, rows}) => window.LetGoHost.setSize(cols, rows));
      sendKey = (s) => window.LetGoHost.sendInput(s);
      term.onData((data) => send(data));
    }
  });
})();
  </script>
</body>
</html>
