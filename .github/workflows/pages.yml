name: pages

# Build the browser version with sound (tools/build-pages.sh), smoke-test it the
# way Pages serves it, then deploy to GitHub Pages. Pages can't set COOP/COEP;
# the COI service worker lg -w ships re-adds them (see build-pages.sh).
# Pull requests build and smoke-test without deploying. Same shape as
# let-go-lab's pages.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight deploy. A PR's runs only
# replace each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # let-go and undertone are pinned by audio-host/go.mod and fetched through the
  # Go module proxy; build-web-onevm.sh builds the lg that compiles the bundle.
  # The bundle is built with TinyGo (pinned here; 0.43 is what it was measured with).
  TINYGO_VERSION: 0.43.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: audio-host/go.mod
          cache-dependency-path: audio-host/go.sum

      - name: Install TinyGo (pinned)
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/tinygo.tar.gz"
          tar -xzf "$RUNNER_TEMP/tinygo.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"

      - name: Build the Pages site
        run: tools/build-pages.sh _site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Smoke-test the site (no COOP/COEP, project subpath)
        run: python tools/pages-smoke.py _site

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true   # turn Pages on (Actions source) if it isn't

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
